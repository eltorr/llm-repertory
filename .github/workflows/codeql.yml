# GitHub's code scanning: data-flow security analysis of this repo's code, its HTTP servers and these workflows.
# Public repository: results appear under Security > Code scanning. Private one (code scanning isn't available to it
# without Advanced Security): the findings are listed on the run's summary page and kept as a SARIF artifact, and
# high-severity ones fail the job.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read           # the CodeQL action reads this run's details; required in a private repository
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # everything this repo runs, apart from the bundled ExLlamaV3 (the Python extractor takes folders, not files)
          config: |
            paths-ignore:
              - exllamav3
              - research
              - docs
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif
      - name: Findings
        if: github.event.repository.private
        run: |
          python3 - <<'EOF'
          import glob, json, os
          rows, high = [], 0
          for path in glob.glob("sarif/*.sarif"):
              run = json.load(open(path))["runs"][0]
              rules = {r["id"]: r for r in run["tool"]["driver"].get("rules", [])}
              for res in run.get("results", []):
                  rule = rules.get(res.get("ruleId"), {})
                  sev = float((rule.get("properties") or {}).get("security-severity") or 0)
                  high += sev >= 7.0
                  loc = res["locations"][0]["physicalLocation"]
                  where = f"{loc['artifactLocation']['uri']}:{loc.get('region', {}).get('startLine', '?')}"
                  rows.append(f"| {sev or '-'} | `{res.get('ruleId')}` | `{where}` | {res['message']['text'][:160]} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### CodeQL ({os.environ['LANG_NAME']}): {len(rows)} finding(s), {high} high or critical\n\n")
              if rows:
                  out.write("| Severity | Rule | Where | Message |\n|---|---|---|---|\n" + "\n".join(rows) + "\n")
          print(f"{len(rows)} finding(s), {high} high or critical")
          raise SystemExit(1 if high else 0)
          EOF
        env:
          LANG_NAME: ${{ matrix.language }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: github.event.repository.private && always()
        with:
          name: codeql-${{ matrix.language }}
          path: sarif
          retention-days: 30
